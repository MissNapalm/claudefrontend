<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THM/OPS</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.4;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  body[data-theme="tactical"] {
    --bg:        #07090d;
    --bg-2:      #0c1116;
    --bg-3:      #11171e;
    --fg:        #b9c6cf;
    --fg-dim:    #6c7c87;
    --accent:    #5cb8d8;
    --accent-2:  #d4a857;
    --good:      #4ea877;
    --bad:       #c25656;
    --line:      #1b2530;
    --line-2:    #283341;
  }
  body[data-theme="pro"] {
    --bg:        #d8d6d2;
    --bg-2:      #e4e2de;
    --bg-3:      #ccc9c3;
    --fg:        #1f1d1b;
    --fg-dim:    #6a655e;
    --accent:    #c4501a;
    --accent-2:  #1e40af;
    --good:      #166534;
    --bad:       #991b1b;
    --line:      #b4b0a8;
    --line-2:    #a09b92;
  }
  ::selection { background: var(--accent); color: var(--bg); }

  #app {
    display: grid;
    grid-template-rows: 36px 1fr 24px;
    height: 100vh;
  }

  #tabs {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  #brand {
    display: flex; align-items: center;
    padding: 0 14px;
    color: var(--accent);
    letter-spacing: 0.22em;
    font-weight: 700;
    font-size: 11px;
    border-right: 1px solid var(--line);
  }
  #brand .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
  }
  .tab {
    background: transparent;
    color: var(--fg-dim);
    border: none;
    border-right: 1px solid var(--line);
    padding: 0 16px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab:hover { color: var(--fg); }
  .tab.active {
    color: var(--accent);
    background: var(--bg-3);
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab .badge {
    padding: 1px 6px;
    border: 1px solid var(--line-2);
    background: var(--bg);
    color: var(--accent-2);
    font-size: 10px;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  #right { flex: 1; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; gap: 12px; }
  #status, #count {
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  #clear {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line-2);
    border-radius: 1px;
    padding: 3px 10px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #clear:hover { color: var(--fg); border-color: var(--fg); }

  .pane {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 14px;
    background: var(--bg);
    display: none;
  }
  .pane.active { display: block; }
  .pane::-webkit-scrollbar { width: 8px; }
  .pane::-webkit-scrollbar-track { background: var(--bg-2); }
  .pane::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 1px; }

  #pane-stream { padding: 6px 14px; }
  .line {
    display: grid;
    grid-template-columns: 78px 70px 1fr;
    gap: 10px;
    padding: 2px 0;
    align-items: baseline;
    animation: slide 0.22s ease-out;
  }
  @keyframes slide {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .ts { color: var(--fg-dim); font-size: 10px; }
  .src {
    text-align: center;
    font-size: 10px;
    padding: 1px 4px;
    border: 1px solid var(--line-2);
    color: var(--fg-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .src-ops    { color: var(--accent);   border-color: var(--accent); }
  .src-claude { color: var(--accent-2); border-color: var(--accent-2); }
  .src-you    { color: var(--fg);       border-color: var(--fg); }
  .src-tool   { color: var(--accent);   border-color: var(--accent); }
  .src-result { color: var(--good);     border-color: var(--good); }
  .msg { color: var(--fg); white-space: pre-wrap; word-break: break-word; }

  /* credentials */
  .empty {
    color: var(--fg-dim);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 14px 4px;
  }
  .cred {
    border: 1px solid var(--line);
    background: var(--bg-2);
    padding: 8px 12px;
    margin-bottom: 6px;
    animation: slide 0.22s ease-out;
  }
  .cred-row {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: 10px;
    align-items: baseline;
    padding: 2px 0;
  }
  .cred-row .k {
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 10px;
  }
  .cred-row .v {
    color: var(--fg);
    font-family: ui-monospace, monospace;
    word-break: break-all;
  }
  .cred-row .v.pw { color: var(--good); font-weight: 600; }
  .cred-row .copy {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line-2);
    padding: 1px 8px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cred-row .copy:hover { color: var(--accent); border-color: var(--accent); }
  .cred-meta {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dotted var(--line);
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .cred-meta .v { color: var(--fg); text-transform: none; letter-spacing: 0; font-family: ui-monospace, monospace; }

  /* nmap + directories — compact tabular rows */
  .row {
    display: grid;
    gap: 12px;
    align-items: baseline;
    padding: 5px 8px;
    border-bottom: 1px dotted var(--line);
    animation: slide 0.22s ease-out;
  }
  .row .k {
    color: var(--fg);
    font-family: ui-monospace, monospace;
    word-break: break-all;
  }
  .row .v   { color: var(--fg-dim); font-size: 11px; word-break: break-word; }
  .row .v.good { color: var(--good); }
  .row .v.warn { color: var(--accent-2); }
  .row .v.bad  { color: var(--bad);  }
  .row .meta {
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: right;
  }
  .nmap-row { grid-template-columns: 90px 130px 1fr auto; }
  .nmap-row .port {
    color: var(--good);
    font-weight: 700;
    font-family: ui-monospace, monospace;
  }
  .nmap-row .svc {
    color: var(--accent);
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
  }
  .dirs-row { grid-template-columns: minmax(260px, 1.5fr) 110px 1fr auto; }
  .dirs-row .size {
    color: var(--fg-dim);
    font-family: ui-monospace, monospace;
    font-size: 11px;
    text-align: right;
  }
  .row-head {
    display: grid;
    gap: 12px;
    padding: 4px 8px;
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line-2);
    margin-bottom: 4px;
  }

  #foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  #theme {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line-2);
    padding: 2px 10px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #theme:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body data-theme="tactical">

<div id="app">

  <div id="tabs">
    <div id="brand"><span class="dot"></span>THM/OPS</div>
    <button class="tab active" data-view="stream">Telemetry</button>
    <button class="tab" data-view="nmap">Nmap <span class="badge" id="badge-nmap">0</span></button>
    <button class="tab" data-view="dirs">Directories <span class="badge" id="badge-dirs">0</span></button>
    <button class="tab" data-view="creds">Credentials <span class="badge" id="badge-creds">0</span></button>
    <div id="right">
      <span id="status">standby</span>
      <span id="count">0 lines</span>
      <button id="clear" title="Clear telemetry">Clear</button>
    </div>
  </div>

  <div id="pane-stream" class="pane active"></div>
  <div id="pane-nmap"   class="pane"></div>
  <div id="pane-dirs"   class="pane"></div>
  <div id="pane-creds"  class="pane"></div>

  <div id="foot">
    <button id="theme" title="Toggle light/dark">◐ <span id="theme-label">Tactical</span></button>
    <span id="src-label">awaiting telemetry…</span>
  </div>

</div>

<script>
"use strict";

const MAX_LINES = 1000;

const state = {
  theme:       localStorage.getItem("thm-theme") || "tactical",
  sessionPath: null,
  eventOffset: 0,
  count:       0,
  lastFresh:   0,
  view:        "stream",
  creds:       JSON.parse(localStorage.getItem("thm-creds") || "{}"),
  ports:       JSON.parse(localStorage.getItem("thm-ports") || "{}"),
  dirs:        JSON.parse(localStorage.getItem("thm-dirs")  || "{}"),
};

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of kids) {
    if (c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}
function pad(n) { return String(n).padStart(2, "0"); }
function nowHHMMSS(d = new Date()) {
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

// ---------- THEME ----------
function applyTheme(t) {
  if (t !== "tactical" && t !== "pro") t = "tactical";
  state.theme = t;
  document.body.setAttribute("data-theme", t);
  localStorage.setItem("thm-theme", t);
  $("#theme-label").textContent = t === "pro" ? "Pro (light)" : "Tactical";
}
applyTheme(state.theme);
$("#theme").addEventListener("click", () => applyTheme(state.theme === "pro" ? "tactical" : "pro"));

// ---------- TABS ----------
$$(".tab").forEach(b => b.addEventListener("click", () => {
  $$(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.view = b.dataset.view;
  $$(".pane").forEach(p => p.classList.remove("active"));
  $("#pane-" + state.view).classList.add("active");
  if (state.view === "creds") renderCreds();
  if (state.view === "nmap")  renderPorts();
  if (state.view === "dirs")  renderDirs();
}));

// ---------- META STRIPPER ----------
function stripMeta(s) {
  if (typeof s !== "string") return "";
  return s
    .replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g, "")
    .replace(/<task-notification>[\s\S]*?<\/task-notification>/g, "")
    .replace(/<command-name>[\s\S]*?<\/command-name>/g, "")
    .replace(/<command-message>[\s\S]*?<\/command-message>/g, "")
    .replace(/<command-args>[\s\S]*?<\/command-args>/g, "")
    .replace(/<local-command-stdout>[\s\S]*?<\/local-command-stdout>/g, "")
    .replace(/<ide_selection>[\s\S]*?<\/ide_selection>/g, "")
    .trim();
}

// ---------- TELEMETRY PANE ----------
const stream = $("#pane-stream");
function nearBottom() { return (stream.scrollHeight - stream.scrollTop - stream.clientHeight) < 60; }
function pushLine(src, msg) {
  if (!msg) return;
  const stick = nearBottom();
  const srcUp = (src || "OPS").toUpperCase();
  const line = el("div", { class: "line" },
    el("span", { class: "ts" }, nowHHMMSS()),
    el("span", { class: "src src-" + srcUp.toLowerCase() }, srcUp),
    el("span", { class: "msg" }, String(msg))
  );
  stream.appendChild(line);
  state.count++;
  while (stream.childElementCount > MAX_LINES) stream.removeChild(stream.firstChild);
  $("#count").textContent = state.count + " line" + (state.count === 1 ? "" : "s");
  if (stick) stream.scrollTop = stream.scrollHeight;
  state.lastFresh = Date.now();
  $("#status").textContent = "live";
  $("#status").style.color = "var(--good)";
}

// ---------- CREDENTIALS ----------
function persistCreds() { localStorage.setItem("thm-creds", JSON.stringify(state.creds)); }
function updateCredBadge() { $("#badge-creds").textContent = Object.keys(state.creds).length; }

function sanitize(s) {
  s = String(s || "");
  for (const sep of ["\n", "\r", "\t", " ", "\\n", '"', "'"]) {
    const i = s.indexOf(sep);
    if (i >= 0) s = s.slice(0, i);
  }
  return s.trim().replace(/[.,;:!?)\]>]+$/, "");
}

function addCred(username, password, service, source, context) {
  username = sanitize(username);
  password = sanitize(password);
  if (!username || !password) return;
  if (username.length > 64 || password.length > 80) return;     // parser garble
  if (/^[*]+$/.test(password)) return;                          // masked
  if (password === "(null)" || password === "null") return;
  const id = username.toLowerCase() + ":" + password;
  if (state.creds[id]) return;
  state.creds[id] = {
    username, password,
    service: service || "",
    source:  source  || "auto",
    context: (context || "").slice(0, 240),
    ts: Date.now(),
  };
  persistCreds(); updateCredBadge();
  pushLine("OPS", "★ CRED CAPTURED → " + username + " : " + password);
  if (state.view === "creds") renderCreds();
}

function renderCreds() {
  const p = $("#pane-creds");
  p.innerHTML = "";
  const entries = Object.entries(state.creds);
  if (!entries.length) {
    p.appendChild(el("div", { class: "empty" }, "No credentials captured yet. Patterns watched: hydra hits, medusa, ncrack, hashcat/john output, explicit Username:/Password:, plus user:pass pairs in cred-shaped lines."));
    return;
  }
  entries.sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  for (const [id, c] of entries) {
    const card = el("div", { class: "cred" },
      el("div", { class: "cred-row" },
        el("span", { class: "k" }, "User"),
        el("span", { class: "v" }, c.username),
        el("button", { class: "copy", onclick: () => { navigator.clipboard.writeText(c.username); } }, "Copy")
      ),
      el("div", { class: "cred-row" },
        el("span", { class: "k" }, "Pass"),
        el("span", { class: "v pw" }, c.password),
        el("button", { class: "copy", onclick: () => { navigator.clipboard.writeText(c.password); } }, "Copy")
      )
    );
    const meta = el("div", { class: "cred-meta" });
    meta.appendChild(el("span", {}, c.service ? "service · " : "", c.service ? el("span", { class: "v" }, c.service) : ""));
    meta.appendChild(el("span", {}, "via · ", el("span", { class: "v" }, c.source)));
    card.appendChild(meta);
    if (c.context) {
      card.appendChild(el("div", {
        style: "margin-top:4px;color:var(--fg-dim);font-size:10px;font-style:italic;word-break:break-all;"
      }, c.context.length > 200 ? c.context.slice(0, 200) + "…" : c.context));
    }
    p.appendChild(card);
  }
}

// ---------- NMAP / OPEN PORTS ----------
function persistPorts() { localStorage.setItem("thm-ports", JSON.stringify(state.ports)); }
function updatePortBadge() { $("#badge-nmap").textContent = Object.keys(state.ports).length; }

function addPort(port, proto, service, version, source) {
  port = Number(port);
  if (!port || port < 1 || port > 65535) return;
  proto = (proto || "tcp").toLowerCase();
  const id = port + "/" + proto;
  const prev = state.ports[id] || {};
  state.ports[id] = {
    port, proto,
    service: service || prev.service || "",
    version: (version || prev.version || "").trim(),
    source:  source || prev.source || "nmap",
    ts: Date.now(),
  };
  persistPorts(); updatePortBadge();
  if (state.view === "nmap") renderPorts();
}

function renderPorts() {
  const p = $("#pane-nmap");
  p.innerHTML = "";
  const entries = Object.values(state.ports);
  if (!entries.length) {
    p.appendChild(el("div", { class: "empty" }, "No open ports observed yet. Nmap output and 'Discovered open port' lines populate this tab automatically."));
    return;
  }
  entries.sort((a, b) => a.port - b.port);
  p.appendChild(el("div", { class: "row-head nmap-row" },
    el("span", {}, "Port"),
    el("span", {}, "Service"),
    el("span", {}, "Version / Banner"),
    el("span", {}, "Via")
  ));
  for (const e of entries) {
    p.appendChild(el("div", { class: "row nmap-row" },
      el("span", { class: "port" }, e.port + "/" + e.proto),
      el("span", { class: "svc" }, e.service || "—"),
      el("span", { class: "v" }, e.version || "—"),
      el("span", { class: "meta" }, e.source)
    ));
  }
}

// ---------- DIRECTORIES ----------
function persistDirs() { localStorage.setItem("thm-dirs", JSON.stringify(state.dirs)); }
function updateDirsBadge() { $("#badge-dirs").textContent = Object.keys(state.dirs).length; }

function addDir(path, code, size, source) {
  if (!path) return;
  path = String(path).split("?")[0].split("#")[0].replace(/[.,;:!?)\]>]+$/, "");
  if (path.length < 2) return;
  // Reject obvious filesystem / placeholder paths — the Directories tab is
  // strictly for WEB paths discovered by gobuster/ffuf/dirb/nikto.
  if (/^\/(?:Users|home|root|tmp|opt|var|etc|usr|bin|sbin|lib|dev|proc|sys|mnt|media|private)\b/i.test(path)) return;
  // Drop bare placeholders like "/path", "/foo", "/example"
  if (/^\/(?:path|foo|bar|baz|example|placeholder|file|dir|something)$/i.test(path)) return;
  // Reject literal man-page placeholders containing "to" or "from"
  if (path === "/" || path === "/index.html" || path === "/favicon.ico") return;
  if (!/^\/[A-Za-z0-9._\/\-~%]{0,160}$/.test(path)) return;
  if (/\.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot|css|map)$/i.test(path)) return;
  // Require a status code OR a recognised web-tool source. No status + no
  // recognised source = we don't actually know if it's a web path.
  const knownSource = ["gobuster", "ffuf", "dirb", "nikto"].includes(source);
  if (!code && !knownSource) return;
  const prev = state.dirs[path] || {};
  state.dirs[path] = {
    path,
    code: code ? String(code) : (prev.code || ""),
    size: size ? String(size) : (prev.size || ""),
    source: source || prev.source || "tool",
    ts: Date.now(),
  };
  persistDirs(); updateDirsBadge();
  if (state.view === "dirs") renderDirs();
}

function renderDirs() {
  const p = $("#pane-dirs");
  p.innerHTML = "";
  const entries = Object.values(state.dirs);
  if (!entries.length) {
    p.appendChild(el("div", { class: "empty" }, "No directories observed yet. gobuster / ffuf / dirb / nikto output populates this tab automatically."));
    return;
  }
  // sort: 200s first, then by path
  const rank = c => c === "200" ? 0 : c === "301" || c === "302" ? 1 : c === "401" || c === "403" ? 2 : 3;
  entries.sort((a, b) => (rank(a.code) - rank(b.code)) || a.path.localeCompare(b.path));
  p.appendChild(el("div", { class: "row-head dirs-row" },
    el("span", {}, "Path"),
    el("span", {}, "Status"),
    el("span", {}, "Notes"),
    el("span", {}, "Size")
  ));
  for (const e of entries) {
    let cls = "v";
    let note = "";
    if (e.code === "200") { cls = "v good"; note = "OK"; }
    else if (e.code === "301" || e.code === "302") { cls = "v"; note = "redirect"; }
    else if (e.code === "401") { cls = "v warn"; note = "auth required"; }
    else if (e.code === "403") { cls = "v warn"; note = "forbidden · exists"; }
    else if (e.code && e.code.startsWith("5")) { cls = "v bad"; note = "server error"; }
    const status = e.code ? "HTTP " + e.code : (e.source === "nikto" ? "nikto" : "—");
    p.appendChild(el("div", { class: "row dirs-row" },
      el("span", { class: "k" }, e.path),
      el("span", { class: cls }, status),
      el("span", { class: "v" }, note || (e.source === "nikto" ? "nikto finding" : "")),
      el("span", { class: "size" }, e.size ? e.size + "b" : "")
    ));
  }
}

// ---------- PORT + DIR EXTRACTION (only on tool_result text) ----------
function scanForPortsAndDirs(line, tool) {
  if (!line) return;
  const L = String(line);
  const src = tool || "tool";
  let m;

  // ---- NMAP open ports ----
  // "Discovered open port 80/tcp on 10.x.x.x"
  if ((m = L.match(/Discovered open port\s+(\d+)\/(tcp|udp)\b/i))) {
    addPort(m[1], m[2], "", "", "nmap");
  }
  // "22/tcp open ssh   OpenSSH 8.2p1 Ubuntu ..."
  if ((m = L.match(/^\s*(\d{1,5})\/(tcp|udp)\s+open\s+(\S+)(?:\s+(.+?))?\s*$/))) {
    addPort(m[1], m[2], m[3], (m[4] || "").trim(), "nmap");
  }
  // "Service Info: OS: Linux; CPE: ..." — sometimes nmap reports services elsewhere
  // (handled implicitly by the line above)

  // ---- GOBUSTER ----
  // "/admin (Status: 200) [Size: 1234]"
  const goRe = /(\/[A-Za-z0-9._\/\-~%]{1,160})\s+\(Status:\s*(\d{3})\)(?:\s*\[Size:\s*(\d+))?/g;
  while ((m = goRe.exec(L)) !== null) addDir(m[1], m[2], m[3] || "", "gobuster");

  // ---- FFUF ----
  // "/admin [Status: 200, Size: 1234, ...]"
  const ffRe = /\b(\/[A-Za-z0-9._\/\-~%]{1,160})\b[^\n]*?\[Status:\s*(\d{3})[^\]]*?(?:Size:\s*(\d+))?/g;
  while ((m = ffRe.exec(L)) !== null) addDir(m[1], m[2], m[3] || "", "ffuf");

  // ---- DIRB ----
  // "http://host/admin (CODE:200|SIZE:1234)"
  const dbRe = /https?:\/\/[^\/\s]+(\/[A-Za-z0-9._\/\-~%]{1,160})\s*\(CODE:(\d{3})\|SIZE:(\d+)\)/g;
  while ((m = dbRe.exec(L)) !== null) addDir(m[1], m[2], m[3], "dirb");

  // ---- NIKTO ----
  if ((m = L.match(/^\+\s+(\/[A-Za-z0-9._\/\-~%]{1,160}):/))) addDir(m[1], "", "", "nikto");
}

// ---------- CRED EXTRACTION (only on tool_result text) ----------
function scanForCreds(line, tool) {
  if (!line) return;
  const L = String(line);
  const src = tool || "tool";
  let m;

  // hydra: "[port][proto] host: 1.2.3.4   login: bob   password: hunter2"
  if ((m = L.match(/host:\s*(\S+).*?login:\s*(\S+)\s+password:\s*([^\s"]+?)(?=\s|\\n|"|$)/i))) {
    addCred(m[2], m[3], "hydra · " + m[1], "hydra", L);
    return;
  }

  // medusa: "ACCOUNT FOUND: [ssh] Host: 1.2.3.4 User: bob Password: hunter2 [SUCCESS]"
  if ((m = L.match(/ACCOUNT FOUND:.*?User:\s*(\S+)\s+Password:\s*(\S+)/i))) {
    addCred(m[1], m[2], "medusa", "medusa", L);
    return;
  }

  // ncrack: "Discovered credentials for ssh on 1.2.3.4:22 - bob:hunter2"
  if ((m = L.match(/Discovered credentials.+?\s+(\S+):(\S+)\s*$/i))) {
    addCred(m[1], m[2], "ncrack", "ncrack", L);
    return;
  }

  // patator: "INFO - ... user:bob password:hunter2"
  if ((m = L.match(/user[=:\s]+(\S+)\s+password[=:\s]+(\S+)/i))) {
    addCred(m[1], m[2], "", "patator/tool", L);
    return;
  }

  // explicit Username:/Password: pair (cracking output, web responses)
  if ((m = L.match(/\bUsername:\s*(\S+)\s+Password:\s*(\S+)/i))) {
    addCred(m[1], m[2], "", "tool", L);
    return;
  }

  // SQL dumps & similar: "username='bob' password='hunter2'"
  if ((m = L.match(/\b(?:username|user|login)\s*[:=]\s*['"]?([A-Za-z0-9._\-@]{2,40})['"]?\s*[,;|]?\s*(?:password|pass|pwd)\s*[:=]\s*['"]?([^\s'",;|]{3,80})['"]?/i))) {
    addCred(m[1], m[2], "", "tool", L);
    return;
  }

  // explicit cleartext leak: "Your new password is: hunter2"
  if ((m = L.match(/Your\s+(?:new\s+)?password\s+is[:\s]+([^\s'",;|]{3,80})/i))) {
    const userM = L.match(/\b(?:for|to)\s+(?:user\s+)?(?:["'`]?)([a-z_][a-z0-9_\-]{1,31})(?:["'`]?)\b/i);
    if (userM) addCred(userM[1], m[1], "leaked", "leak", L);
    return;
  }

  // hashcat/john cracked output: "$hash$:plaintext"  or "user:plaintext (cracked)"
  if ((m = L.match(/^\s*([a-z_][a-z0-9_\-]{1,31}):([^\s:]{3,80})\s+\(cracked\)/im))) {
    addCred(m[1], m[2], "", "hashcat/john", L);
    return;
  }

  // bare "bob:hunter2" only when LINE looks credential-shaped
  if (/\b(?:cred|credentials|password|hash|cracked|valid|found|success|root|admin|user)\b/i.test(L)) {
    const simple = L.match(/(?:^|\s|["'`(])([a-z_][a-z0-9_\-]{1,31}):([^\s'"`)/\\:]{4,80})(?=\s|$|["'`),.;])/i);
    if (simple) {
      const p = simple[2];
      const looksJunk = /^\d{1,5}$/.test(p) ||
                       /^\d+\.\d+/.test(p) ||
                       /^\d\d:\d\d/.test(p) ||
                       p.includes("/") || p.includes("\\");
      if (!looksJunk) addCred(simple[1], p, "", "tool", L);
    }
  }
}

// ---------- EVENT INGESTION ----------
function renderEvent(ev) {
  if (!ev) return;
  const t = ev.type || "";
  if (t === "assistant_text" || (ev.role === "assistant" && ev.text)) {
    const text = stripMeta(ev.text || "");
    if (text) pushLine("CLAUDE", text.length > 600 ? text.slice(0, 600) + "…" : text);
  } else if (t === "user_text" || (ev.role === "user" && ev.text)) {
    const text = stripMeta(ev.text || "");
    if (text) pushLine("YOU", text.length > 600 ? text.slice(0, 600) + "…" : text);
  } else if (t === "tool_use") {
    const name = ev.tool || ev.name || "tool";
    const prev = ev.input_preview ? " — " + ev.input_preview : "";
    pushLine("TOOL", "▶ " + name + prev);
  } else if (t === "tool_result") {
    const text = stripMeta(ev.text || "");
    if (text) {
      pushLine("RESULT", text.length > 500 ? text.slice(0, 500) + "…" : text);
      text.split("\n").forEach(ln => {
        scanForCreds(ln, ev.tool || "tool");
        scanForPortsAndDirs(ln, ev.tool || "tool");
      });
    }
  }
}

// ---------- POLLING ----------
async function fetchJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch { return null; }
}
async function pollSessions() {
  const r = await fetchJSON("/api/sessions");
  if (!r || !Array.isArray(r.sessions)) return;
  const fresh = r.sessions
    .filter(s => Date.now() - (s.mtime || 0) * 1000 < 60000)
    .sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  if (!fresh.length) return;
  const pick = fresh[0];
  if (pick.path !== state.sessionPath) {
    state.sessionPath = pick.path;
    state.eventOffset = 0;
    $("#src-label").textContent = "tailing " + pick.path;
  }
}
async function pollEvents() {
  if (!state.sessionPath) return;
  const u = "/api/events?path=" + encodeURIComponent(state.sessionPath) + "&offset=" + state.eventOffset;
  const r = await fetchJSON(u);
  if (!r) return;
  if (typeof r.offset === "number") state.eventOffset = r.offset;
  if (r.events && r.events.length) for (const ev of r.events) renderEvent(ev);
}

setInterval(() => {
  if (Date.now() - state.lastFresh > 4000) {
    $("#status").textContent = "standby";
    $("#status").style.color = "var(--fg-dim)";
  }
}, 1000);

$("#clear").addEventListener("click", () => {
  // telemetry
  stream.innerHTML = "";
  state.count = 0;
  $("#count").textContent = "0 lines";
  // nmap
  state.ports = {};
  localStorage.removeItem("thm-ports");
  updatePortBadge();
  if (state.view === "nmap") renderPorts();
  // directories
  state.dirs = {};
  localStorage.removeItem("thm-dirs");
  updateDirsBadge();
  if (state.view === "dirs") renderDirs();
  // credentials
  state.creds = {};
  localStorage.removeItem("thm-creds");
  updateCredBadge();
  if (state.view === "creds") renderCreds();
});

updateCredBadge();
updatePortBadge();
updateDirsBadge();
pushLine("OPS", "HUD initialized — awaiting telemetry.");
pollSessions();
setInterval(pollSessions, 3000);
setInterval(pollEvents, 400);
</script>
