<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THM/OPS</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.4;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  body[data-theme="tactical"] {
    --bg:        #07090d;
    --bg-2:      #0c1116;
    --bg-3:      #11171e;
    --fg:        #b9c6cf;
    --fg-dim:    #6c7c87;
    --accent:    #5cb8d8;
    --accent-2:  #d4a857;
    --good:      #4ea877;
    --bad:       #c25656;
    --crit:      #e85d75;
    --line:      #1b2530;
    --line-2:    #283341;
  }
  body[data-theme="pro"] {
    --bg:        #d8d6d2;
    --bg-2:      #e4e2de;
    --bg-3:      #ccc9c3;
    --fg:        #1f1d1b;
    --fg-dim:    #6a655e;
    --accent:    #c4501a;
    --accent-2:  #1e40af;
    --good:      #166534;
    --bad:       #991b1b;
    --crit:      #7f1d1d;
    --line:      #b4b0a8;
    --line-2:    #a09b92;
  }
  ::selection { background: var(--accent); color: var(--bg); }

  /* ------------------ APP GRID ------------------
     row 1: tabs (36)
     row 2: main (left targets | center pane | right detail)
     row 3: bottom telemetry drawer (resizable, default 160)
     row 4: foot (24)
  ----------------------------------------------- */
  #app {
    display: grid;
    grid-template-rows: 36px 1fr 6px 180px 24px;
    grid-template-columns: 220px 1fr 280px;
    height: 100vh;
  }
  #tabs    { grid-row: 1; grid-column: 1 / -1; }
  #left    { grid-row: 2; grid-column: 1; }
  #center  { grid-row: 2; grid-column: 2; }
  #right   { grid-row: 2; grid-column: 3; }
  #splitter{ grid-row: 3; grid-column: 1 / -1; }
  #drawer  { grid-row: 4; grid-column: 1 / -1; }
  #foot    { grid-row: 5; grid-column: 1 / -1; }

  /* ------------------ TABS ------------------ */
  #tabs {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    overflow-x: auto;
  }
  #brand {
    display: flex; align-items: center;
    padding: 0 14px;
    color: var(--accent);
    letter-spacing: 0.22em;
    font-weight: 700;
    font-size: 11px;
    border-right: 1px solid var(--line);
    flex-shrink: 0;
  }
  #brand .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 6px var(--accent);
  }
  .tab {
    background: transparent;
    color: var(--fg-dim);
    border: none;
    border-right: 1px solid var(--line);
    padding: 0 12px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .tab:hover { color: var(--fg); }
  .tab.active {
    color: var(--accent);
    background: var(--bg-3);
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab .badge {
    padding: 1px 5px;
    border: 1px solid var(--line-2);
    background: var(--bg);
    color: var(--accent-2);
    font-size: 9px;
    letter-spacing: 0.05em;
    font-weight: 600;
    min-width: 16px;
    text-align: center;
  }
  .tab .badge.crit { color: var(--crit); border-color: var(--crit); }
  #tabs-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
    gap: 10px;
  }
  #search {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line-2);
    padding: 3px 8px;
    font-family: inherit;
    font-size: 11px;
    width: 200px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #status, #count {
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .btn-mini {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line-2);
    padding: 3px 9px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-mini:hover { color: var(--fg); border-color: var(--fg); }

  /* ------------------ LEFT TARGETS ------------------ */
  #left {
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .left-head {
    padding: 8px 12px;
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .host {
    border-bottom: 1px dotted var(--line);
    padding: 6px 12px;
    cursor: pointer;
    animation: slide 0.22s ease-out;
  }
  .host:hover { background: var(--bg-3); }
  .host.active { background: var(--bg-3); box-shadow: inset 3px 0 0 var(--accent); }
  .host-ip {
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    word-break: break-all;
  }
  .host-meta {
    color: var(--fg-dim);
    font-size: 10px;
    margin-top: 2px;
    word-break: break-word;
  }
  .host-counts {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .host-counts .pill {
    color: var(--fg-dim);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .host-counts .pill b { color: var(--fg); font-weight: 600; }

  /* ------------------ CENTER PANES ------------------ */
  #center { overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .pane-header {
    padding: 6px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .pane-header .title {
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 11px;
  }
  .pane-header .subtitle {
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-left: auto;
  }
  .pane {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 14px;
    background: var(--bg);
    display: none;
  }
  .pane.active { display: block; }
  .pane::-webkit-scrollbar,
  #left::-webkit-scrollbar,
  #right::-webkit-scrollbar,
  #pane-stream::-webkit-scrollbar { width: 8px; }
  .pane::-webkit-scrollbar-track,
  #left::-webkit-scrollbar-track,
  #right::-webkit-scrollbar-track,
  #pane-stream::-webkit-scrollbar-track { background: var(--bg-2); }
  .pane::-webkit-scrollbar-thumb,
  #left::-webkit-scrollbar-thumb,
  #right::-webkit-scrollbar-thumb,
  #pane-stream::-webkit-scrollbar-thumb { background: var(--line-2); }

  /* ------------------ RIGHT DETAIL ------------------ */
  #right {
    background: var(--bg-2);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 8px 12px;
  }
  .detail-empty {
    color: var(--fg-dim);
    font-size: 11px;
    text-align: center;
    padding: 24px 8px;
    line-height: 1.6;
  }
  .detail-card { animation: slide 0.22s ease-out; }
  .detail-title {
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 10px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .detail-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 8px;
    padding: 3px 0;
    align-items: baseline;
  }
  .detail-row .k {
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 9px;
  }
  .detail-row .v {
    color: var(--fg);
    word-break: break-word;
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }
  .detail-ctx {
    margin-top: 8px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--fg-dim);
    font-size: 10px;
    font-style: italic;
    border-left: 2px solid var(--line-2);
    word-break: break-all;
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  /* ------------------ SPLITTER ------------------ */
  #splitter {
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: ns-resize;
    position: relative;
  }
  #splitter:hover { background: var(--line); }
  #splitter::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 1px;
    background: var(--fg-dim);
  }

  /* ------------------ DRAWER (telemetry) ------------------ */
  #drawer {
    background: var(--bg);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 14px;
  }
  #drawer::-webkit-scrollbar { width: 8px; }
  #drawer::-webkit-scrollbar-track { background: var(--bg-2); }
  #drawer::-webkit-scrollbar-thumb { background: var(--line-2); }
  .line {
    display: grid;
    grid-template-columns: 70px 64px 1fr;
    gap: 10px;
    padding: 1px 0;
    align-items: baseline;
    animation: slide 0.18s ease-out;
  }
  @keyframes slide {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .ts { color: var(--fg-dim); font-size: 10px; }
  .src {
    text-align: center;
    font-size: 9px;
    padding: 1px 4px;
    border: 1px solid var(--line-2);
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .src-ops    { color: var(--accent);   border-color: var(--accent); }
  .src-claude { color: var(--accent-2); border-color: var(--accent-2); }
  .src-you    { color: var(--fg);       border-color: var(--fg); }
  .src-tool   { color: var(--accent);   border-color: var(--accent); }
  .src-result { color: var(--good);     border-color: var(--good); }
  .src-loot   { color: var(--accent-2); border-color: var(--accent-2); }
  .msg { color: var(--fg); white-space: pre-wrap; word-break: break-word; font-size: 11px; }

  /* ------------------ DATA ROWS ------------------ */
  .empty {
    color: var(--fg-dim);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 14px 4px;
    text-align: center;
  }
  .row {
    display: grid;
    gap: 12px;
    align-items: baseline;
    padding: 5px 8px;
    border-bottom: 1px dotted var(--line);
    cursor: pointer;
    animation: slide 0.22s ease-out;
  }
  .row:hover { background: var(--bg-2); }
  .row.selected { background: var(--bg-3); box-shadow: inset 3px 0 0 var(--accent); }
  .row .k {
    color: var(--fg);
    font-family: ui-monospace, monospace;
    word-break: break-all;
  }
  .row .v   { color: var(--fg-dim); font-size: 11px; word-break: break-word; }
  .row .v.good { color: var(--good); }
  .row .v.warn { color: var(--accent-2); }
  .row .v.bad  { color: var(--bad);  }
  .row .v.crit { color: var(--crit); font-weight: 600; }
  .row .meta {
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: right;
  }
  .row-head {
    display: grid;
    gap: 12px;
    padding: 4px 8px;
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line-2);
    margin-bottom: 2px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  /* per-table layouts */
  .hosts-row { grid-template-columns: 130px 1fr 1fr 70px; }
  .nmap-row  { grid-template-columns: 90px 130px 1fr auto; }
  .nmap-row .port {
    color: var(--good);
    font-weight: 700;
    font-family: ui-monospace, monospace;
  }
  .nmap-row .svc {
    color: var(--accent);
    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
  }
  .dirs-row { grid-template-columns: minmax(220px, 1.5fr) 100px 1fr 80px auto; }
  .dirs-row .size {
    color: var(--fg-dim);
    font-family: ui-monospace, monospace;
    font-size: 11px;
    text-align: right;
  }
  .creds-row { grid-template-columns: 1fr 1fr 110px auto; }
  .creds-row .v.pw { color: var(--good); font-weight: 600; }
  .cves-row  { grid-template-columns: 160px 60px 1fr 80px auto; }
  .cves-row .cve-id { color: var(--accent); font-weight: 600; font-family: ui-monospace, monospace; }
  .cves-row .cvss   { font-weight: 700; text-align: center; }
  .vulns-row { grid-template-columns: 90px 90px 1fr auto; }
  .hash-row  { grid-template-columns: 110px 90px 1fr auto; }
  .share-row { grid-template-columns: 160px 80px 1fr auto; }
  .user-row  { grid-template-columns: 1fr 1fr auto; }
  .sub-row   { grid-template-columns: 1fr 130px auto; }
  .loot-row  { grid-template-columns: 110px minmax(180px, 1fr) 1fr auto; }
  .shell-row { grid-template-columns: 130px 100px 80px 1fr auto; }
  .note-row  { grid-template-columns: 130px 1fr auto; }

  .copy {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line-2);
    padding: 1px 8px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent); }

  /* ------------------ FOOT ------------------ */
  #foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--fg-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  #foot .spacer { flex: 1; }
  #foot .filter-tag {
    background: var(--bg-3);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 1px 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 10px;
    cursor: pointer;
  }
  #foot .filter-tag:hover { color: var(--bg); background: var(--accent); }
</style>
</head>
<body data-theme="tactical">

<div id="app">

  <div id="tabs">
    <div id="brand"><span class="dot"></span>THM/OPS</div>
    <button class="tab" data-view="hosts">Hosts <span class="badge" id="b-hosts">0</span></button>
    <button class="tab active" data-view="nmap">Ports <span class="badge" id="b-nmap">0</span></button>
    <button class="tab" data-view="dirs">Dirs <span class="badge" id="b-dirs">0</span></button>
    <button class="tab" data-view="subs">Subs <span class="badge" id="b-subs">0</span></button>
    <button class="tab" data-view="users">Users <span class="badge" id="b-users">0</span></button>
    <button class="tab" data-view="creds">Creds <span class="badge" id="b-creds">0</span></button>
    <button class="tab" data-view="hashes">Hashes <span class="badge" id="b-hashes">0</span></button>
    <button class="tab" data-view="cves">CVEs <span class="badge crit" id="b-cves">0</span></button>
    <button class="tab" data-view="vulns">Vulns <span class="badge crit" id="b-vulns">0</span></button>
    <button class="tab" data-view="shares">Shares <span class="badge" id="b-shares">0</span></button>
    <button class="tab" data-view="shells">Shells <span class="badge" id="b-shells">0</span></button>
    <button class="tab" data-view="loot">Loot <span class="badge" id="b-loot">0</span></button>
    <button class="tab" data-view="notes">Notes <span class="badge" id="b-notes">0</span></button>
    <div id="tabs-right">
      <input id="search" type="text" placeholder="filter (host, text)…" />
      <span id="status">standby</span>
      <button id="export" class="btn-mini" title="Export session as JSON">Export</button>
      <button id="clear" class="btn-mini" title="Clear all data">Clear</button>
    </div>
  </div>

  <div id="left">
    <div class="left-head">
      <span>Targets</span>
      <span id="host-count">0</span>
    </div>
    <div id="hosts-list"></div>
  </div>

  <div id="center">
    <div class="pane-header">
      <span class="title" id="pane-title">Ports</span>
      <span class="subtitle" id="pane-subtitle">awaiting telemetry</span>
    </div>
    <div id="pane-hosts"  class="pane"></div>
    <div id="pane-nmap"   class="pane active"></div>
    <div id="pane-dirs"   class="pane"></div>
    <div id="pane-subs"   class="pane"></div>
    <div id="pane-users"  class="pane"></div>
    <div id="pane-creds"  class="pane"></div>
    <div id="pane-hashes" class="pane"></div>
    <div id="pane-cves"   class="pane"></div>
    <div id="pane-vulns"  class="pane"></div>
    <div id="pane-shares" class="pane"></div>
    <div id="pane-shells" class="pane"></div>
    <div id="pane-loot"   class="pane"></div>
    <div id="pane-notes"  class="pane"></div>
  </div>

  <div id="right">
    <div id="detail" class="detail-empty">
      Select a row to view details.<br><br>
      <span style="font-size:10px;letter-spacing:0.1em;">CLICK ANY ROW · SHOWS RAW CONTEXT</span>
    </div>
  </div>

  <div id="splitter" title="Drag to resize telemetry drawer"></div>

  <div id="drawer"></div>

  <div id="foot">
    <button id="theme" class="btn-mini" title="Toggle light/dark">◐ <span id="theme-label">Tactical</span></button>
    <span id="src-label">awaiting telemetry…</span>
    <span class="spacer"></span>
    <span id="loot-label">loot: idle</span>
    <span id="count">0 lines</span>
    <span id="host-filter" style="display:none"></span>
  </div>

</div>

<script>
"use strict";

const MAX_LINES = 1000;

const state = {
  theme:       localStorage.getItem("thm-theme") || "tactical",
  sessionPath: null,
  eventOffset: 0,
  count:       0,
  lastFresh:   0,
  view:        "nmap",
  hostFilter:  null,      // when set, all panes filter to this host
  selected:    null,      // currently selected row's data, for right pane

  // legacy ops.jsonl-driven state (kept for backwards compat)
  creds:       JSON.parse(localStorage.getItem("thm-creds") || "{}"),
  ports:       JSON.parse(localStorage.getItem("thm-ports") || "{}"),
  dirs:        JSON.parse(localStorage.getItem("thm-dirs")  || "{}"),

  // loot.jsonl-driven state (the new pipeline)
  hosts:       JSON.parse(localStorage.getItem("thm-hosts")  || "{}"),
  users:       JSON.parse(localStorage.getItem("thm-users")  || "{}"),
  hashes:      JSON.parse(localStorage.getItem("thm-hashes") || "{}"),
  cves:        JSON.parse(localStorage.getItem("thm-cves")   || "{}"),
  vulns:       JSON.parse(localStorage.getItem("thm-vulns")  || "{}"),
  shares:      JSON.parse(localStorage.getItem("thm-shares") || "{}"),
  subs:        JSON.parse(localStorage.getItem("thm-subs")   || "{}"),
  loot:        JSON.parse(localStorage.getItem("thm-loot")   || "{}"),
  shells:      JSON.parse(localStorage.getItem("thm-shells") || "{}"),
  notes:       JSON.parse(localStorage.getItem("thm-notes")  || "{}"),

  // loot.jsonl tail bookkeeping
  lootFiles:   {},        // path → { offset, lastSeen }
};

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of kids) {
    if (c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}
function pad(n) { return String(n).padStart(2, "0"); }
function nowHHMMSS(d = new Date()) {
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function persist(key, obj) { localStorage.setItem("thm-" + key, JSON.stringify(obj)); }

// ---------- THEME ----------
function applyTheme(t) {
  if (t !== "tactical" && t !== "pro") t = "tactical";
  state.theme = t;
  document.body.setAttribute("data-theme", t);
  localStorage.setItem("thm-theme", t);
  $("#theme-label").textContent = t === "pro" ? "Pro (light)" : "Tactical";
}
applyTheme(state.theme);
$("#theme").addEventListener("click", () => applyTheme(state.theme === "pro" ? "tactical" : "pro"));

// ---------- TABS ----------
$$(".tab").forEach(b => b.addEventListener("click", () => {
  $$(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.view = b.dataset.view;
  $$(".pane").forEach(p => p.classList.remove("active"));

// ---------- SPLITTER (drawer resize) ----------
(function () {
  const sp = $("#splitter");
  const app = $("#app");
  let dragging = false;
  sp.addEventListener("mousedown", (e) => { dragging = true; e.preventDefault(); document.body.style.userSelect = "none"; });
  window.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const h = Math.max(60, Math.min(window.innerHeight - 200, window.innerHeight - e.clientY - 24));
    app.style.gridTemplateRows = "36px 1fr 6px " + h + "px 24px";
  });
})();

// ---------- META STRIPPER (for telemetry text) ----------
function stripMeta(s) {
  if (typeof s !== "string") return "";
  return s
    .replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g, "")
    .replace(/<task-notification>[\s\S]*?<\/task-notification>/g, "")
    .replace(/<command-name>[\s\S]*?<\/command-name>/g, "")
    .replace(/<command-message>[\s\S]*?<\/command-message>/g, "")
    .replace(/<command-args>[\s\S]*?<\/command-args>/g, "")
    .replace(/<local-command-stdout>[\s\S]*?<\/local-command-stdout>/g, "")
    .replace(/<ide_selection>[\s\S]*?<\/ide_selection>/g, "")
    .trim();
}

// ---------- DRAWER (telemetry stream) ----------
const drawer = $("#drawer");
function nearBottom() { return (drawer.scrollHeight - drawer.scrollTop - drawer.clientHeight) < 60; }
function pushLine(src, msg) {
  if (!msg) return;
  const stick = nearBottom();
  const srcUp = (src || "OPS").toUpperCase();
  const line = el("div", { class: "line" },
    el("span", { class: "ts" }, nowHHMMSS()),
    el("span", { class: "src src-" + srcUp.toLowerCase() }, srcUp),
    el("span", { class: "msg" }, String(msg))
  );
  drawer.appendChild(line);
  state.count++;
  while (drawer.childElementCount > MAX_LINES) drawer.removeChild(drawer.firstChild);
  $("#count").textContent = state.count + " line" + (state.count === 1 ? "" : "s");
  if (stick) drawer.scrollTop = drawer.scrollHeight;
  state.lastFresh = Date.now();
  $("#status").textContent = "live";
  $("#status").style.color = "var(--good)";
}

// ---------- HOST FILTER + LEFT TARGETS ----------
function setHostFilter(ip) {
  state.hostFilter = ip || null;
  const tag = $("#host-filter");
  if (ip) {
    tag.style.display = "";
    tag.className = "filter-tag";
    tag.textContent = "filter · " + ip + " ✕";
    tag.onclick = () => setHostFilter(null);
  } else {
    tag.style.display = "none";
  }
  renderLeft();
  renderAll();
}

function ensureHost(ip) {
  if (!ip) return;
  if (!state.hosts[ip]) {
    state.hosts[ip] = { ip, ts: Math.floor(Date.now() / 1000) };
    persist("hosts", state.hosts);
  }
}

function hostCounts(ip) {
  let p = 0, d = 0, c = 0, v = 0;
  for (const k in state.ports)  if (state.ports[k].host === ip) p++;
  for (const k in state.dirs)   if (state.dirs[k].host === ip) d++;
  for (const k in state.creds)  if (state.creds[k].host === ip) c++;
  for (const k in state.cves)   if (state.cves[k].host === ip)  v++;
  for (const k in state.vulns)  if (state.vulns[k].host === ip) v++;
  return { p, d, c, v };
}

function renderLeft() {
  const list = $("#hosts-list");
  list.innerHTML = "";
  const entries = Object.values(state.hosts);
  $("#host-count").textContent = entries.length;
  if (!entries.length) {
    list.appendChild(el("div", { class: "empty" }, "no targets yet"));
    return;
  }
  entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  for (const h of entries) {
    const cnt = hostCounts(h.ip);
    const card = el("div", {
      class: "host" + (state.hostFilter === h.ip ? " active" : ""),
      onclick: () => setHostFilter(state.hostFilter === h.ip ? null : h.ip),
    },
      el("div", { class: "host-ip" }, h.ip),
      el("div", { class: "host-meta" }, h.hostname || h.os || h.notes || "—"),
      el("div", { class: "host-counts" },
        el("span", { class: "pill" }, el("b", {}, String(cnt.p)), " ports"),
        el("span", { class: "pill" }, el("b", {}, String(cnt.d)), " dirs"),
        el("span", { class: "pill" }, el("b", {}, String(cnt.c)), " creds"),
        el("span", { class: "pill" }, el("b", {}, String(cnt.v)), " vulns")
      )
    );
    list.appendChild(card);
  }
}

// ---------- FILTER HELPER ----------
function applyFilter(arr) {
  const q = ($("#search").value || "").toLowerCase().trim();
  const hf = state.hostFilter;
  return arr.filter(e => {
    if (hf && e.host && e.host !== hf) return false;
    if (!q) return true;
    return JSON.stringify(e).toLowerCase().includes(q);
  });
}
$("#search").addEventListener("input", () => renderAll());

// ---------- INGEST (called by both polling pipelines) ----------
function ingestRecord(r) {
  if (!r || typeof r !== "object" || !r.type) return;
  if (r.host) ensureHost(r.host);
  switch (r.type) {
    case "host": {
      const ip = r.ip || r.host;
      if (!ip) return;
      const prev = state.hosts[ip] || {};
      state.hosts[ip] = Object.assign({}, prev, r, { ip, ts: r.ts || prev.ts || Math.floor(Date.now() / 1000) });
      persist("hosts", state.hosts);
      pushLine("LOOT", "✚ host " + ip + (r.hostname ? " (" + r.hostname + ")" : ""));
      break;
    }
    case "port": {
      const id = (r.host || "_") + ":" + r.port + "/" + (r.proto || "tcp");
      const prev = state.ports[id] || {};
      state.ports[id] = Object.assign({}, prev, r, { id });
      persist("ports", state.ports);
      pushLine("LOOT", "✚ port " + r.port + "/" + (r.proto || "tcp") + " " + (r.service || "") + (r.host ? " · " + r.host : ""));
      break;
    }
    case "dir": {
      const id = (r.host || "_") + "|" + (r.url || "");
      const prev = state.dirs[id] || {};
      state.dirs[id] = Object.assign({}, prev, r, { id });
      persist("dirs", state.dirs);
      pushLine("LOOT", "✚ dir " + (r.url || "") + (r.status ? " (" + r.status + ")" : ""));
      break;
    }
    case "cred": {
      const id = (r.host || "_") + "|" + (r.user || "") + ":" + (r.pass || "");
      if (state.creds[id]) return;
      state.creds[id] = Object.assign({}, r, { id });
      persist("creds", state.creds);
      pushLine("LOOT", "★ CRED " + (r.user || "") + " : " + (r.pass || ""));
      break;
    }
    case "hash": {
      const id = (r.host || "_") + "|" + (r.user || "?") + "|" + (r.hash || "").slice(0, 32);
      state.hashes[id] = Object.assign({}, r, { id });
      persist("hashes", state.hashes);
      pushLine("LOOT", "✚ hash " + (r.algo || "") + " · " + (r.user || ""));
      break;
    }
    case "cve": {
      const id = (r.host || "_") + "|" + (r.id || "");
      state.cves[id] = Object.assign({}, r, { _id: id });
      persist("cves", state.cves);
      pushLine("LOOT", "✚ CVE " + (r.id || "") + " (cvss " + (r.cvss != null ? r.cvss : "?") + ")");
      break;
    }
    case "vuln": {
      const id = (r.host || "_") + "|" + (r.category || "") + "|" + (r.url || "") + "|" + (r.payload || "").slice(0, 40);
      state.vulns[id] = Object.assign({}, r, { id });
      persist("vulns", state.vulns);
      pushLine("LOOT", "✚ vuln " + (r.category || "") + " · " + (r.severity || ""));
      break;
    }
    case "share": {
      const id = (r.host || "_") + "|" + (r.name || "");
      state.shares[id] = Object.assign({}, r, { id });
      persist("shares", state.shares);
      pushLine("LOOT", "✚ share " + (r.name || "") + " · " + (r.perms || ""));
      break;
    }
    case "user": {
      const id = (r.host || "_") + "|" + (r.name || "");
      state.users[id] = Object.assign({}, r, { id });
      persist("users", state.users);
      pushLine("LOOT", "✚ user " + (r.name || ""));
      break;
    }
    case "subdomain": {
      const id = r.name || "";
      if (!id) return;
      state.subs[id] = Object.assign({}, r, { id });
      persist("subs", state.subs);
      pushLine("LOOT", "✚ subdomain " + r.name);
      break;
    }
    case "loot": {
      const id = (r.host || "_") + "|" + (r.kind || "") + "|" + (r.path || r.value || "").slice(0, 80);
      state.loot[id] = Object.assign({}, r, { id });
      persist("loot", state.loot);
      const head = r.kind === "flag" ? "★ FLAG " : "✚ loot ";
      pushLine("LOOT", head + (r.kind || "") + " · " + (r.path || r.value || r.note || ""));
      break;
    }
    case "shell": {
      const id = (r.host || "_") + "|" + (r.user || "") + "|" + (r.ts || Date.now());
      state.shells[id] = Object.assign({}, r, { id });
      persist("shells", state.shells);
      pushLine("LOOT", "✚ shell as " + (r.user || "?") + " (" + (r.privilege || "?") + ")");
      break;
    }
    case "note": {
      const id = (r.host || "_") + "|" + (r.text || "").slice(0, 80);
      state.notes[id] = Object.assign({}, r, { id });
      persist("notes", state.notes);
      pushLine("LOOT", "✎ note · " + (r.text || "").slice(0, 80));
      break;
    }
    default:
      pushLine("LOOT", "? unknown type: " + r.type);
  }
  refreshBadges();
  renderLeft();
}

    return;
  }
  p.appendChild(el("div", { class: "row-head hosts-row" },

function renderDirs() {
  const p = $("#pane-dirs");
  p.innerHTML = "";
  const entries = applyFilter(Object.values(state.dirs));
  if (!entries.length) {
    p.appendChild(el("div", { class: "empty" }, "no directories yet"));
    return;
  }
  const rank = c => c == 200 ? 0 : c == 301 || c == 302 ? 1 : c == 401 || c == 403 ? 2 : 3;
  entries.sort((a, b) => (rank(a.status || a.code) - rank(b.status || b.code)) || (a.url || a.path || "").localeCompare(b.url || b.path || ""));
  p.appendChild(el("div", { class: "row-head dirs-row" },
    el("span", {}, "Path"),
    el("span", {}, "Status"),
    el("span", {}, "Notes"),
    el("span", {}, "Size"),
    el("span", {}, "Host")
  ));
  for (const e of entries) {
    const code = String(e.status || e.code || "");
    let cls = "v", note = "";
    if (code === "200") { cls = "v good"; note = "OK"; }
    else if (code === "301" || code === "302") { cls = "v"; note = "redirect"; }
    else if (code === "401") { cls = "v warn"; note = "auth required"; }
    else if (code === "403") { cls = "v warn"; note = "forbidden · exists"; }
    else if (code.startsWith("5")) { cls = "v bad"; note = "server error"; }
    const status = code ? "HTTP " + code : (e.tool === "nikto" ? "nikto" : "—");
    const url = e.url || e.path || "";
    p.appendChild(el("div", {
      class: "row dirs-row",
      onclick: () => showDetail("Directory", [
        ["URL", url], ["Status", status], ["Size", e.size], ["Tool", e.tool || e.source], ["Host", e.host]
      ])
    },
      el("span", { class: "k" }, url),
      el("span", { class: cls }, status),
      el("span", { class: "v" }, note || (e.tool === "nikto" ? "nikto finding" : "")),
      el("span", { class: "size" }, e.size ? e.size + "b" : ""),
      el("span", { class: "meta" }, e.host || "—")
    ));
  }
}

function renderCves() {
  const p = $("#pane-cves");
  p.innerHTML = "";
  const entries = applyFilter(Object.values(state.cves));
  if (!entries.length) {
    p.appendChild(el("div", { class: "empty" }, "no CVEs yet — emit type:cve records"));
    return;
  }
  entries.sort((a, b) => (b.cvss || 0) - (a.cvss || 0));
  p.appendChild(el("div", { class: "row-head cves-row" },
    el("span", {}, "CVE"),
    el("span", {}, "CVSS"),
    el("span", {}, "Service / Notes"),
    el("span", {}, "Host"),
    el("span", {}, "")
  ));
  for (const e of entries) {
    const score = e.cvss != null ? Number(e.cvss).toFixed(1) : "—";
    let cls = "v cvss";
    if (e.cvss >= 9)      cls = "v cvss crit";
    else if (e.cvss >= 7) cls = "v cvss bad";
    else if (e.cvss >= 4) cls = "v cvss warn";
    else                  cls = "v cvss good";
    p.appendChild(el("div", {
      class: "row cves-row",
      onclick: () => showDetail(e.id || "CVE", [
        ["CVE", e.id], ["CVSS", score], ["Service", e.service], ["Version", e.version],
        ["Exploit", e.exploit_available ? "available" : "unknown"],
        ["Host", e.host], ["Notes", e.notes]
      ])
    },
      el("span", { class: "cve-id" }, e.id || ""),
      el("span", { class: cls }, score),
      el("span", { class: "v" }, (e.service || "") + (e.version ? " " + e.version : "") + (e.notes ? " · " + e.notes : "")),
      el("span", { class: "v" }, e.host || "—"),
      el("span", { class: "meta" }, e.exploit_available ? "EXPLOIT" : "")

  }
}

}

// ---------- LEGACY: telemetry from ops.jsonl ----------
function renderEvent(ev) {
  if (!ev) return;
  const t = ev.type || "";
  if (t === "assistant_text" || (ev.role === "assistant" && ev.text)) {
    const text = stripMeta(ev.text || "");
    if (text) pushLine("CLAUDE", text.length > 600 ? text.slice(0, 600) + "…" : text);
  } else if (t === "user_text" || (ev.role === "user" && ev.text)) {
    const text = stripMeta(ev.text || "");
    if (text) pushLine("YOU", text.length > 600 ? text.slice(0, 600) + "…" : text);
  } else if (t === "tool_use") {
    const name = ev.tool || ev.name || "tool";
    const prev = ev.input_preview ? " — " + ev.input_preview : "";
    pushLine("TOOL", "▶ " + name + prev);
  } else if (t === "tool_result") {
    const text = stripMeta(ev.text || "");
    if (text) pushLine("RESULT", text.length > 500 ? text.slice(0, 500) + "…" : text);
  }
}

// ---------- POLLING ----------
async function fetchJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch { return null; }
}

async function pollSessions() {
  const r = await fetchJSON("/api/sessions");
  if (!r || !Array.isArray(r.sessions)) return;
  const fresh = r.sessions
    .filter(s => Date.now() - (s.mtime || 0) * 1000 < 60000)
    .sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  if (!fresh.length) return;
  const pick = fresh[0];
  if (pick.path !== state.sessionPath) {
    state.sessionPath = pick.path;
    state.eventOffset = 0;
    $("#src-label").textContent = "tailing " + pick.path;
  }
}
async function pollEvents() {
  if (!state.sessionPath) return;
  const u = "/api/events?path=" + encodeURIComponent(state.sessionPath) + "&offset=" + state.eventOffset;
  const r = await fetchJSON(u);
  if (!r) return;
  if (typeof r.offset === "number") state.eventOffset = r.offset;
  if (r.events && r.events.length) for (const ev of r.events) renderEvent(ev);
}

// ---------- LOOT.JSONL POLLING (the new pipeline) ----------
async function pollLootFiles() {
  const r = await fetchJSON("/api/loot-files");
  if (!r || !Array.isArray(r.files)) return;
  const live = new Set();
  for (const f of r.files) {
    live.add(f.path);
    if (!state.lootFiles[f.path]) {
      state.lootFiles[f.path] = { offset: 0, name: f.path };
      pushLine("OPS", "▸ loot stream attached → " + f.path);
    }
  }
  // mark loot label
  const n = Object.keys(state.lootFiles).length;
  $("#loot-label").textContent = n ? "loot: " + n + " stream" + (n === 1 ? "" : "s") : "loot: idle";
  // drop stale
  for (const k of Object.keys(state.lootFiles)) {
    if (!live.has(k)) {
      pushLine("OPS", "▸ loot stream detached → " + k);
      delete state.lootFiles[k];
    }
  }
}

async function pollLootTails() {
  const paths = Object.keys(state.lootFiles);
  for (const p of paths) {
    const st = state.lootFiles[p];
    const u = "/api/loot?path=" + encodeURIComponent(p) + "&offset=" + st.offset;
    const r = await fetchJSON(u);
    if (!r) continue;
    if (typeof r.offset === "number") st.offset = r.offset;
    if (r.events && r.events.length) {
      for (const ev of r.events) ingestRecord(ev);
      // re-render only the active view to keep things snappy
      renderAll();
    }
  }
}

// ---------- EXPORT ----------
function exportSession() {
  const out = {
    exportedAt: new Date().toISOString(),
    hosts: Object.values(state.hosts),
    ports: Object.values(state.ports),
    dirs: Object.values(state.dirs),
    subs: Object.values(state.subs),
    users: Object.values(state.users),
    creds: Object.values(state.creds),
    hashes: Object.values(state.hashes),
    cves: Object.values(state.cves),
    vulns: Object.values(state.vulns),
    shares: Object.values(state.shares),
    shells: Object.values(state.shells),
    loot: Object.values(state.loot),
    notes: Object.values(state.notes),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = el("a", {
    href: URL.createObjectURL(blob),
    download: "thm-ops-" + new Date().toISOString().replace(/[:.]/g, "-") + ".json",
  });
  a.click();
}
$("#export").addEventListener("click", exportSession);

// ---------- CLEAR ----------
$("#clear").addEventListener("click", () => {
  if (!confirm("Clear all captured data? This cannot be undone.")) return;
  drawer.innerHTML = "";
  state.count = 0;
  $("#count").textContent = "0 lines";
  for (const k of ["hosts","ports","dirs","subs","users","creds","hashes","cves","vulns","shares","shells","loot","notes"]) {
    state[k] = {};
    localStorage.removeItem("thm-" + k);
  }
  renderAll();
  renderLeft();
  clearDetail();
});

// ---------- STATUS HEARTBEAT ----------
setInterval(() => {
  if (Date.now() - state.lastFresh > 4000) {
    $("#status").textContent = "standby";
    $("#status").style.color = "var(--fg-dim)";
  }
}, 1000);

// ---------- BOOT ----------
refreshBadges();
renderLeft();
renderAll();
pushLine("OPS", "HUD initialized — awaiting telemetry & loot streams.");
pollSessions();
pollLootFiles();
setInterval(pollSessions, 3000);
setInterval(pollEvents, 400);
setInterval(pollLootFiles, 4000);
setInterval(pollLootTails, 500);
</script>
